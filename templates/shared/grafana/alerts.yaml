apiVersion: 1
groups:
  - orgId: 1
    name: "{{SERVICE_NAME}} baseline"
    folder: "create-service"
    interval: 1m
    rules:
      - uid: "{{SERVICE_ID}}-high-error-rate"
        title: "{{SERVICE_NAME}} high error rate"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: "${datasource}"
            model:
              expr: "sum(rate(http_requests_total{service=\"{{SERVICE_NAME}}\",status=~\"5..\"}[5m]))"
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0.05]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "{{SERVICE_NAME}} 5xx rate is elevated"
        labels:
          service_id: "{{SERVICE_ID}}"
          target: "{{TARGET}}"
