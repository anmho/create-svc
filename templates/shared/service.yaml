apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: ${SERVICE_NAME}
  labels:
    managed_by: create-service
    service_id: ${SERVICE_ID}
    service_role: ${SERVICE_ROLE}
  annotations:
    run.googleapis.com/ingress: ${SERVICE_INGRESS}
spec:
  template:
    metadata:
      labels:
        managed_by: create-service
        service_id: ${SERVICE_ID}
        service_role: ${SERVICE_ROLE}
      annotations:
        # Per-role: api scales to zero; the Temporal worker must stay warm with
        # CPU always allocated. Values come from autoscalingForProcess().
        autoscaling.knative.dev/minScale: "${SERVICE_MIN_SCALE}"
        run.googleapis.com/cpu-throttling: "${SERVICE_CPU_THROTTLING}"
    spec:
      serviceAccountName: ${RUNTIME_SERVICE_ACCOUNT}
      containers:
        - image: ${IMAGE_URL}
${CONTAINER_COMMAND}
          ports:
            - containerPort: 8080
          env:
            - name: APP_RUNTIME
              value: ${SERVICE_RUNTIME}
            - name: APP_FRAMEWORK
              value: ${SERVICE_FRAMEWORK}
            - name: TEMPORAL_ENABLED
              value: "${TEMPORAL_ENABLED}"
            - name: TEMPORAL_ADDRESS
              value: "${TEMPORAL_ADDRESS}"
            - name: TEMPORAL_NAMESPACE
              value: "${TEMPORAL_NAMESPACE}"
            - name: TEMPORAL_TASK_QUEUE
              value: "${TEMPORAL_TASK_QUEUE}"
${TEMPORAL_API_KEY_ENV}
${TEMPORAL_MTLS_ENV}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ${DATABASE_URL_SECRET}
                  key: latest
            - name: AUTH_ENABLED
              value: "true"
            - name: AUTH_ISSUER
              value: ${AUTH_ISSUER}
            - name: AUTH_AUDIENCE
              value: ${AUTH_AUDIENCE}
            - name: AUTH_JWKS_URL
              value: ${AUTH_JWKS_URL}
  traffic:
    - latestRevision: true
      percent: 100
