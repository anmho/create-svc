apiVersion: run.googleapis.com/v1
kind: WorkerPool
metadata:
  name: ${WORKER_POOL_NAME}
  labels:
    managed_by: create-service
    service_id: ${SERVICE_ID}
    service_role: worker
  annotations:
    # CREMA scales this pool 0..N off Temporal Task Queue backlog, so the
    # pool itself stays at minScale 0. CPU must stay always-allocated or the
    # poll loop starves while idle. See plans/temporal-worker-pools-crema.md.
    autoscaling.knative.dev/minScale: "0"
    autoscaling.knative.dev/maxScale: "${WORKER_POOL_MAX_SCALE}"
spec:
  template:
    metadata:
      labels:
        managed_by: create-service
        service_id: ${SERVICE_ID}
        service_role: worker
      annotations:
        run.googleapis.com/cpu-throttling: "false"
    spec:
      serviceAccountName: ${RUNTIME_SERVICE_ACCOUNT}
      containers:
        - image: ${IMAGE_URL}
${CONTAINER_COMMAND}
          env:
            - name: APP_RUNTIME
              value: ${SERVICE_RUNTIME}
            - name: APP_FRAMEWORK
              value: ${SERVICE_FRAMEWORK}
            - name: TEMPORAL_ENABLED
              value: "${TEMPORAL_ENABLED}"
            - name: TEMPORAL_ADDRESS
              value: "${TEMPORAL_ADDRESS}"
            - name: TEMPORAL_NAMESPACE
              value: "${TEMPORAL_NAMESPACE}"
            - name: TEMPORAL_TASK_QUEUE
              value: "${TEMPORAL_TASK_QUEUE}"
${TEMPORAL_API_KEY_ENV}
${TEMPORAL_MTLS_ENV}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ${DATABASE_URL_SECRET}
                  key: latest
            - name: AUTH_ENABLED
              value: "true"
            - name: AUTH_ISSUER
              value: ${AUTH_ISSUER}
            - name: AUTH_AUDIENCE
              value: ${AUTH_AUDIENCE}
            - name: AUTH_JWKS_URL
              value: ${AUTH_JWKS_URL}
