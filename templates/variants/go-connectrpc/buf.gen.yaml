version: v2
plugins:
  - local: protoc-gen-go
    out: gen
    opt:
      - paths=source_relative
      - Mwaitlist/v1/waitlist.proto={{MODULE_PATH}}/gen/waitlist/v1
  - local: protoc-gen-connect-go
    out: gen
    opt:
      - paths=source_relative
      - Mwaitlist/v1/waitlist.proto={{MODULE_PATH}}/gen/waitlist/v1
